<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Snowbound Crossword</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: one frosted puzzle card (clue bar, scrolling grid, toolbar) over a fixed snowy dusk scene, clue lists below.
   Deliberately a single look: a winter night scene, so there is no light/dark switch. */
:root {
  --sky-top: #14224a;
  --sky-mid: #34588a;
  --sky-low: #a9c6e4;
  --snow: #f4f9fd;
  --ink: #162544;
  --ink-soft: #4d6584;
  --ice: #d3e8fb;
  --line: #b7cbe2;
  --lantern: #f3b04a;
  --lantern-deep: #d98a1e;
  --wrong: #c63d3d;
  --wrong-bg: #fde3e1;
  --pine: #1d3c4a;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cell: 36px;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0;
  background: var(--sky-top);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}

/* ---------- scene ---------- */
.sky {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(circle at 84% 14%, rgba(255,247,222,.55) 0, rgba(255,247,222,.18) 70px, transparent 190px),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
}
.moon {
  position: fixed; z-index: 0; top: 11%; right: 14%;
  width: 46px; height: 46px; border-radius: 50%;
  background: #fff8e3; box-shadow: 0 0 30px 8px rgba(255,248,227,.45);
}
.scene {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 0;
  width: 100%; height: min(36vh, 320px);
  pointer-events: none;
}
#snow { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }

/* ---------- page ---------- */
.wrap { position: relative; z-index: 2; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { color: #f4f8fd; }
h1 {
  margin: 0; font-family: var(--display); font-weight: 400;
  font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; letter-spacing: .005em;
  text-wrap: balance; text-shadow: 0 2px 18px rgba(8,18,40,.45);
}
header p { margin: 8px 0 0; color: #c6d8ee; max-width: 60ch; text-shadow: 0 1px 8px rgba(8,18,40,.5); }

.card {
  background: rgba(244,249,253,.93);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 16px;
  box-shadow: 0 18px 50px rgba(8,18,40,.35);
}
.puzzle { padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.clue-bar {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  min-height: 3.1em; padding: 10px 14px; border-radius: 10px;
  background: var(--ice); border: 1px solid var(--line);
}
.clue-bar .tag {
  font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink); white-space: nowrap;
}
.clue-bar .txt { font-size: 1.08rem; font-weight: 600; min-width: 0; }
.clue-bar .len { color: var(--ink-soft); font-weight: 400; white-space: nowrap; }

.scroller { overflow-x: auto; padding: 4px 2px 10px; max-width: 100%; }
.grid {
  display: grid; width: max-content; gap: 2px;
  grid-template-columns: repeat(var(--cols), var(--cell));
  grid-auto-rows: var(--cell);
}
.cell {
  position: relative; background: #fff; border-radius: 4px;
  box-shadow: 0 0 0 1px var(--line) inset;
  transition: background-color .12s;
}
.cell.inword { background: var(--ice); }
.cell.active { background: var(--lantern); box-shadow: 0 0 0 2px var(--lantern-deep) inset; }
.cell.wrong { background: var(--wrong-bg); box-shadow: 0 0 0 2px var(--wrong) inset; }
.cell.wrong input { color: var(--wrong); }
.cell .num {
  position: absolute; top: 2px; left: 4px; font-size: 10px; line-height: 1; font-weight: 700;
  color: var(--ink-soft); pointer-events: none;
}
.cell.active .num { color: var(--ink); }
.cell input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; outline: 0; background: transparent; padding: 7px 0 0; margin: 0;
  text-align: center; text-transform: uppercase;
  font: 700 calc(var(--cell) * .54) var(--body); color: var(--ink);
  caret-color: transparent; cursor: pointer; border-radius: 4px;
}
.cell input::selection { background: transparent; }

.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.toolbar .grow { flex: 1 1 auto; }
.stat { font-size: .92rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.stat b { color: var(--ink); }
.saved { font-size: .85rem; color: var(--ink-soft); }
button { font: inherit; cursor: pointer; }
.btn {
  border: 1px solid var(--ink); background: var(--ink); color: #fff;
  padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: .95rem;
}
.btn.quiet { background: transparent; color: var(--ink); }
.btn:hover { filter: brightness(1.15); }
.btn.quiet:hover { background: var(--ice); filter: none; }
.btn:focus-visible, .clue:focus-visible { outline: 3px solid var(--lantern-deep); outline-offset: 2px; }
.msg { min-height: 1.4em; font-weight: 600; margin: 0; }

.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }
.lists section { padding: 16px 12px 12px; min-width: 0; }
.lists h2 {
  margin: 0 0 8px 8px; font-family: var(--display); font-weight: 400; font-size: 1.4rem;
}
.lists ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.clue {
  display: grid; grid-template-columns: 2.4rem 1fr auto; gap: 8px; align-items: baseline;
  width: 100%; text-align: left; background: transparent; border: 0; color: var(--ink);
  padding: 7px 8px; border-radius: 8px;
}
.clue:hover { background: rgba(211,232,251,.6); }
.clue .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.clue .l { color: var(--ink-soft); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.clue[aria-current="true"] { background: var(--ice); box-shadow: 0 0 0 1px var(--line) inset; }
.clue.done .t { color: var(--ink-soft); }
.clue.done .n::after { content: " \2713"; font-weight: 600; color: var(--ink-soft); }

@media (max-width: 640px) {
  :root { --cell: 31px; }
  .puzzle { padding: 12px; }
  .clue-bar .txt { font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) { .cell { transition: none; } }
</style>

<script>
(function () {

e in the mountains, but don't go chasing them", "num": 4, "len": 9}, {"n": 23, "w": "SWANSEA", "r": 1, "c": 28, "d": "D", "clue": "Welsh town like a bird on the water", "num": 5, "len": 7}, {"n": 5, "w": "WORM", "r": 2, "c": 3, "d": "D", "clue": "Seems a little small to describe a dragon.", "num": 6, "len": 4}, {"n": 6, "w": "CAMP", "r": 3, "c": 1, "d": "D", "clue": "Somewhat more than a tent.", "num": 8, "len": 4}, {"n": 7, "w": "GONDOLA", "r": 3, "c": 8, "d": "D", "clue": "Goes up a mountain, as well as along a canal.", "num": 9, "len": 7}, {"n": 15, "w": "SQUEAK", "r": 3, "c": 23, "d": "D", "clue": "Rodent noise, or a noisy rodent", "num": 11, "len": 6}, {"n": 12, "w": "LAKE", "r": 5, "c": 5, "d": "D", "clue": "An evil body of water? (Second word)", "num": 14, "len": 4}, {"n": 2, "w": "BANFF", "r": 5, "c": 25, "d": "D", "clue": "Gateway to the Rockies? More like a loud thump.", "num": 16, "len": 5}]};

  var KEY = 'snowbound-crossword-v1';
  var sig = words.map(function (x) { return x.w + x.r + x.c + x.d; }).join('|');

  var cells = new Map();
  words.forEach(function (wd, i) {
    wd.id = i; wd.cells = [];
    for (var k = 0; k < wd.len; k++) {
      var r = wd.r + (wd.d === 'D' ? k : 0), c = wd.c + (wd.d === 'A' ? k : 0), key = r + ',' + c;

  var scroller = document.getElementById('scroller');

  var cur = { ce: null, dir: 'A' };

  /* ---------- build grid ---------- */
  for (var r = 0; r < H; r++) {

      var ce = cells.get(r + ',' + c);
      if (!ce) { gridEl.appendChild(document.createElement('div')); continue; }

      var dir = cur.dir;

  var msg = document.getElementById('msg');
  document.getElementById('check').addEventListener('click', function () {
    var wrong = 0, filled = 0;
    cells.forEach(function (ce) {
      ce.el.classList.remove('wrong');
      if (ce.input.value) { filled++; if (ce.input.value !== ce.ans) { wrong++; ce.el.classList.add('wrong'); } }
    });
    if (!filled) msg.textContent = 'Nothing to check yet.';
    else if (wrong) msg.textContent = wrong + (wrong === 1 ? ' letter needs' : ' letters need') + ' another look (marked in red).';
    else if (filled === total) msg.textContent = 'Solved. Every answer is correct.';
    else msg.textContent = 'So far so good: every letter you have entered is right.';
  });
  var clearBtn = document.getElementById('clear'), clearTimer = null;
  clearBtn.addEventListener('click', function () {
    if (!clearTimer) {
      clearBtn.textContent = 'Click again to clear everything';
      clearTimer = setTimeout(function () { clearBtn.textContent = 'Clear all'; clearTimer = null; }, 3500);
      return;
    }
    clearTimeout(clearTimer); clearTimer = null; clearBtn.textContent = 'Clear all';
    cells.forEach(function (ce) { ce.input.value = ''; ce.el.classList.remove('wrong'); });
    changed();
  });

  /* ---------- start ---------- */
  load(); updateProgress();
  select(words[0].cells[0], words[0].d, false);

  /* ---------- falling snow ---------- */
  var cv = document.getElementById('snow'), ctx = cv.getContext('2d');
  var flakes = [], sw = 0, sh = 0, raf = 0;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function mk(init) {
    var z = Math.random();
    return { x: Math.random() * sw, y: init ? Math.random() * sh : -6, r: 0.8 + z * 2.4, v: 0.35 + z * 1.1, s: Math.random() * 6.28, a: 0.45 + z * 0.5 };
  }
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    sw = window.innerWidth; sh = window.innerHeight;
    cv.width = sw * dpr; cv.height = sh * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(Math.min(170, sw / 8));
    flakes = []; for (var i = 0; i < n; i++) flakes.push(mk(true));
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, sw, sh); ctx.fillStyle = '#ffffff';
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i]; ctx.globalAlpha = f.a; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function tick() {
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i]; f.y += f.v; f.s += 0.012; f.x += Math.sin(f.s) * 0.4;
      if (f.y > sh + 6) flakes[i] = mk(false);
    }
    draw(); raf = requestAnimationFrame(tick);
  }
  window.addEventListener('resize', resize);
  resize();
  if (!reduce) {
    raf = requestAnimationFrame(tick);
    document.addEventListener('visibilitychange', function () {
      cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(tick);
    });
  }
})();
</script>
<script>
window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' || e.code === 'Escape') {
    e.preventDefault();
    try { window.parent.postMessage({ type: 'advent-close' }, '*'); } catch (err) {}
  }
});
</script>
