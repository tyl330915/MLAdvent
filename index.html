<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotswold Advent Calendar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="stage" id="stage">
  <img class="background" src="assets/background.jpg" alt="A snowy Cotswold village at dusk with numbered doors and a Christmas tree">
  <div class="hotspots" id="hotspots"></div>
  <div class="tree-number" aria-hidden="true">25</div>
  <div class="snow-layer" id="snowLayer" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Advent door content">
  <div class="modal-content">
    <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
